# TLS-only MQTT listener. StackPort publishes the host-side TCP port.
listener 8883 0.0.0.0
protocol mqtt

certfile /mosquitto/certs/fullchain.pem
keyfile /mosquitto/certs/privkey.pem
tls_version tlsv1.2
require_certificate false

# Plain WebSocket listener for browsers (Paho JS). Never published to the host:
# StackPort's nginx terminates TLS (Let's Encrypt) for an HTTP domain routed to mqtt:9001.
listener 9001 0.0.0.0
protocol websockets

allow_anonymous false
per_listener_settings false

plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

# Broker statistics on $SYS/#, read by the mqtt-admin stats snapshot.
sys_interval 10

persistence true
persistence_location /mosquitto/data/
autosave_interval 60
autosave_on_changes true

user mosquitto
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
# TEMPORARY: logs every PINGREQ/PINGRESP to diagnose keepalive drops. Remove after the capture.
log_type debug
connection_messages true
log_timestamp true
